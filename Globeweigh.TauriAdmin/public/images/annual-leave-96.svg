<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" aria-hidden="true">
  <!-- Annual Leave: a wall calendar, drawn like the other nav icons (white outline, ~5px line,
       no fill or colour). -->
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="20" width="68" height="62" rx="4"/>
    <path d="M14 36 H 82"/>
    <path d="M32 12 V 26"/>
    <path d="M64 12 V 26"/>
  </g>
  <g fill="#ffffff">
    <rect x="24" y="46" width="10" height="9" rx="1"/>
    <rect x="43" y="46" width="10" height="9" rx="1"/>
    <rect x="62" y="46" width="10" height="9" rx="1"/>
    <rect x="24" y="63" width="10" height="9" rx="1"/>
    <rect x="43" y="63" width="10" height="9" rx="1"/>
  </g>
  <!-- The booked day: a tick in the last square. -->
  <path d="M62 68 L 66 72 L 73 62" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
