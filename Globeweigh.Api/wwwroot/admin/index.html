<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="images/Globe-96.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Globeweigh Manager</title>
    <style>
      /* Boot splash — shown until React mounts and replaces #root's content.
         Background mirrors .login-page in App.css so load → login is seamless. */
      html,
      body {
        height: 100%;
        margin: 0;
        background: radial-gradient(ellipse at top, #152338 0%, #0d1624 55%, #070d16 100%);
      }
      #root {
        height: 100%;
      }
      .boot-screen {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      .boot-spinner {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: rgba(255, 255, 255, 0.85);
        animation: boot-spin 0.8s linear infinite;
      }
      .boot-text {
        font-family:
          "Poppins", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.4px;
        color: rgba(255, 255, 255, 0.65);
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BbPQFHXr.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/CommercialInvoiceSheet-CHviCR1g.js">
    <link rel="stylesheet" crossorigin href="./assets/CommercialInvoiceSheet-CNuOnMrv.css">
    <link rel="stylesheet" crossorigin href="./assets/index-CHPMI7GM.css">
  </head>

  <body>
    <div id="root">
      <div class="boot-screen">
        <div class="boot-spinner"></div>
        <div class="boot-text">Loading Globeweigh WMS…</div>
      </div>
    </div>
    <script>
      // Boot watchdog: if the app bundle hasn't mounted within 12s (e.g. a stale
      // index.html referencing a replaced asset, or a blip during a deploy),
      // re-fetch the page with a cache-buster instead of spinning forever.
      // Gives up after 3 attempts (server genuinely down). main.tsx clears the
      // counter once the app mounts.
      setTimeout(function () {
        var root = document.getElementById("root");
        if (!root || !root.querySelector(".boot-screen")) return; // app mounted
        var attempts = Number(sessionStorage.getItem("bootRetry") || "0");
        if (attempts >= 3) return;
        sessionStorage.setItem("bootRetry", String(attempts + 1));
        window.location.replace(window.location.pathname + "?r=" + Date.now());
      }, 12000);
    </script>
  </body>
</html>
