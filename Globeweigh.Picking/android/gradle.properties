org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin incremental compilation breaks when the pub cache (C:) and the project (D:)
# are on different drives — it can't compute relative cache paths and the debug build
# fails with "this and base files have different roots". Disabling it avoids the crash
# (release builds only warned; `flutter run` debug builds fail hard without this).
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
